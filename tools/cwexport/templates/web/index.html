<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>@TITLE@</title>
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #10131a; --card: #1c2130; --edge: #39405a; --text: #e8e8ec; --dim: #9aa1b6; --accent: #ffb23e; }
  /* the page never scrolls or zooms: a pinch or double-tap belongs to the game */
  html, body { margin: 0; width: 100%; height: 100%; height: 100dvh; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
  canvas { display: block; image-rendering: auto; outline: none; touch-action: none; }
  /* the loading panel: download progress, then "starting", then errors (with a retry) */
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    box-sizing: border-box; background: var(--bg); z-index: 1; transition: opacity .35s ease; }
  #msg.done { opacity: 0; pointer-events: none; }
  #msg .card { width: min(420px, 100%); max-height: 100%; overflow: auto; box-sizing: border-box; text-align: center; padding: 8px; }
  #msg .icon { width: clamp(56px, 18vmin, 96px); height: auto; border-radius: 22%; display: block; margin: 0 auto 12px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .35); }
  #msg .title { font-size: clamp(20px, 5vmin, 28px); font-weight: 700; margin: 0 0 16px; letter-spacing: .01em; }
  #msg .bar { height: 6px; border-radius: 3px; background: #2a3045; overflow: hidden; position: relative; }
  #msg .bar span { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); border-radius: 3px; transition: width .2s linear; }
  #msg .info { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; color: var(--dim);
    font-size: 13px; font-variant-numeric: tabular-nums; }
  /* length unknown: a band sweeping across */
  #msg.indeterminate .bar span { width: 35%; animation: sweep 1.2s ease-in-out infinite; }
  @keyframes sweep { from { left: -35%; } to { left: 100%; } }
  /* starting: the full bar breathes while the game compiles and boots */
  #msg.starting .bar span { width: 100%; animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; } }
  /* the steps after the download: a light sweeping over the bar, animated on the
     compositor (transform), so it keeps moving while the page is busy compiling */
  #msg.working .bar::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 30%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent); animation: shine 1.1s linear infinite; }
  @keyframes shine { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) {
    #msg.working .bar::after { animation: none; display: none; }
    #msg, #msg .bar span { transition: none; }
    #msg.indeterminate .bar span { animation: none; left: 0; width: 100%; opacity: .5; }
    #msg.starting .bar span { animation: none; }
  }
  #msg .error { display: none; text-align: left; background: var(--card); border: 1px solid var(--edge); border-radius: 8px;
    padding: 16px 20px; margin-top: 4px; }
  #msg.failed .progress { display: none; }
  #msg.failed .error { display: block; }
  #msg h2 { font-size: 17px; margin: 0 0 8px; }
  #msg code { background: var(--bg); padding: 1px 5px; border-radius: 4px; word-break: break-word; }
  #msg button { font: inherit; font-weight: 600; margin-top: 8px; padding: 10px 22px; min-height: 44px; border-radius: 8px;
    border: 0; background: var(--accent); color: #1a1205; cursor: pointer; }
  @media (max-height: 420px) { #msg .icon { width: 48px; margin-bottom: 6px; } #msg .title { margin-bottom: 10px; }
    #msg.failed .icon { display: none; } #msg.failed .card { width: min(640px, 100%); } }
  /* a landscape game held upright on a phone: a gentle hint, never a block */
  #rotate { display: none; position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: rgba(0,0,0,.55); color: #fff; padding: 8px 14px; border-radius: 18px; font-size: 14px; pointer-events: none; z-index: 2; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
</style>
</head>
<body>
<div id="rotate">↻ Turn your phone sideways for a bigger view</div>
<canvas id="screen" tabindex="0"></canvas>
<div id="msg" class="indeterminate" role="status" aria-live="polite">
  <div class="card">
    <img class="icon" src="icon.png" alt="" onerror="this.remove()">
    <div class="title">@TITLE@</div>
    <div class="progress">
      <div class="bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100"><span id="bar"></span></div>
      <div class="info"><span id="stage">Loading…</span><span id="amount"></span></div>
    </div>
    <div class="error"><h2 id="msg-title"></h2><div id="msg-body"></div><button id="retry" type="button">Try again</button></div>
  </div>
</div>
<script type="module" src="player.js"></script>
</body>
</html>
