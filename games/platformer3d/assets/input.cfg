# platformer3d controls (cartwheel/input.h binding text). Keyboard + gamepad.
move_left = key:a, key:left, pad:left, axis:lx-
move_right = key:d, key:right, pad:right, axis:lx+
move_forward = key:w, key:up, pad:up, axis:ly-
move_back = key:s, key:down, pad:down, axis:ly+
jump = key:space, key:k, pad:south
dash = key:lshift, key:j, pad:west, pad:rshoulder
start = key:return, key:space, pad:start, pad:south
