name: SDK

# Prebuilt engine SDKs (docs/sdk.md): one tarball per target, attached to the
# release of a v* tag. A game builds against the SDK for its engine version
# and compiles only its own code.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

env:
  CW_CART_LINK_JOBS: 2
  BINARYEN_CORES: 4
  # the libraries every native SDK compiles (the rest of the lock is for carts, tests and exports)
  NATIVE_DEPS: three.c,box2d,box3d,sdl2,stb,miniaudio,meshoptimizer,wasmcart-libs,basis_universal,kb,recastnavigation,pl_mpeg,lz4,font:*

jobs:
  sdk:
    name: SDK ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04, deps: 'export/llvm-mingw,export/sysroot-linux-x64,export/native-dawn-linux-x64' }
          - { target: linux-arm64, os: ubuntu-24.04-arm, deps: 'export/llvm-mingw,export/sysroot-linux-arm64,export/native-dawn-linux-arm64' }
          - { target: windows-x64, os: ubuntu-24.04, deps: 'export/llvm-mingw,export/native-dawn-win32-x64,export/angle-gles-win32-x64' }
          - { target: android-arm64, os: ubuntu-24.04, deps: 'export/llvm-mingw,export/native-dawn-android-arm64' }
          - { target: macos-arm64, os: macos-15, deps: 'export/native-dawn-darwin-arm64,export/angle-gles-darwin-arm64' }
          - { target: cart-wgpu, os: ubuntu-24.04, deps: '' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja gnu-tar
      - name: Android NDK
        if: matrix.target == 'android-arm64'
        run: |
          ver=27.2.12479018
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ver" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ver" >> "$GITHUB_ENV"
          echo "CW_SDK_NDK_VERSION=$ver" >> "$GITHUB_ENV"
      - name: Fetch dependencies
        run: |
          case "${{ matrix.target }}" in
            cart-wgpu) scripts/fetch-deps.sh ;;
            *) scripts/fetch-deps.sh --only "$NATIVE_DEPS,${{ matrix.deps }}" ;;
          esac
      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$(git describe --tags --always)-$(date -u +%Y%m%d)"; fi
          echo "CW_SDK_VERSION=$v" >> "$GITHUB_ENV"
          [ "$RUNNER_OS" = macOS ] && echo "CW_SDK_XCODE_VERSION=$(xcodebuild -version | head -1 | cut -d' ' -f2)" >> "$GITHUB_ENV" || true
      - name: Build the SDK (Release)
        run: scripts/build-sdk.sh ${{ matrix.target }}
      - name: Build the SDK (Debug)
        if: matrix.target != 'cart-wgpu'
        run: BUILD_TYPE=Debug scripts/build-sdk.sh ${{ matrix.target }}
      - name: "Link a game against the SDK (a cart SDK: pack a cart with art)"
        run: scripts/sdk-link-check.sh ${{ matrix.target }} "out/sdk/cartwheel-sdk-$CW_SDK_VERSION-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: sdk-${{ matrix.target }}
          path: |
            out/sdk/*.tar.gz
            out/sdk/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    needs: sdk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write # the tagged commit's CI run on main, rerun when a later push cancelled it
    steps:
      # tag only commits whose push to main has a green CI run (never release an unchecked commit). The tag is
      # usually pushed right after main, while that run is still going: wait for it, a look a minute, up to 3 hours.
      # A run cancelled by a later push (the group keeps one run pending) is run again, twice at most; a failure,
      # a commit that is not on main, or the time running out fails this job.
      - name: The tagged commit is green on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$GITHUB_SHA"
          case "$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq .status 2>/dev/null)" in
            behind|identical) ;;
            *) echo "$sha is not on main: push it to main and let CI pass before tagging it" >&2; exit 1 ;;
          esac
          deadline=$(( $(date +%s) + 10800 )); reruns=0
          look() {
            gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$sha" \
              --limit 1 --json databaseId,status,conclusion,url \
              --jq '.[0] // empty | [.databaseId, .status, (.conclusion // "" | if . == "" then "-" else . end), .url] | join(" ")'
          }
          while :; do
            set -- $(look)
            if [ $# -eq 0 ]; then
              echo "$(date -u +%H:%M:%S) no CI run on main for $sha yet"
            else
              case "$2:$3" in
                completed:success) echo "green: run $1 ($4)"; exit 0 ;;
                completed:cancelled)
                  [ $reruns -lt 2 ] || { echo "the CI run on main for $sha was cancelled again ($4): rerun it, then rerun this one" >&2; exit 1; }
                  reruns=$((reruns + 1)); echo "$(date -u +%H:%M:%S) run $1 was cancelled: rerunning it ($reruns of 2) $4"
                  gh run rerun "$1" -R "$GITHUB_REPOSITORY" || exit 1
                  for i in 1 2 3 4 5 6; do sleep 10; set -- $(look); [ "$2" = completed ] || break; done ;;
                completed:*) echo "the CI run on main for $sha ended $3 ($4): fix main (or rerun that run), then rerun this one" >&2; exit 1 ;;
                *) echo "$(date -u +%H:%M:%S) waiting on run $1 ($2) $4" ;;
              esac
            fi
            [ "$(date +%s)" -lt "$deadline" ] || { echo "no green CI run on main for $sha after 3 hours" >&2; exit 1; }
            sleep 60
          done
      - uses: actions/download-artifact@v8
        with:
          path: sdk
          merge-multiple: true
      - name: Attach the SDKs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l sdk
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          # SDKs are immutable: once a release carries an SDK, it never changes
          # (docs/sdk.md, "Versions"), so a game pinned to it builds the same forever
          have="$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in sdk/*; do
            if grep -qxF "$(basename "$f")" <<< "$have"; then
              echo "$GITHUB_REF_NAME already has $(basename "$f"): published SDKs are never replaced; tag a new version" >&2
              exit 1
            fi
          done
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" sdk/*
