name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # a branch's CI before it lands on main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CW_TEST_GPU: software # Mesa llvmpipe (GL) and lavapipe (WebGPU): see tests/ci.mjs
  CW_CART_LINK_JOBS: 2
  CW_RUN_TIMEOUT_MS: 1800000 # one native run; llvmpipe is far slower than a GPU (open_world: about 0.75 s a frame)

jobs:
  # The native build, once: the test jobs below unpack it instead of each building it.
  build:
    name: Native build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libsdl2-dev libegl-dev libgles-dev
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/deps.lock', 'scripts/fetch-deps.sh', 'patches/**') }}
      - name: Fetch dependencies
        run: scripts/fetch-deps.sh
      - name: Build native
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build/native
      - name: API and docs checks
        run: |
          node tools/gen-api.mjs --check
          node tools/gen-noise-shaders.mjs --check
          node tools/gen-docs.mjs --check
      # a tar keeps the executable bits and the object files (gates that rebuild a
      # target, such as editor-agent and hot, find it up to date)
      - name: Pack the build
        run: tar -cf - build/native | zstd -T0 -3 -o native-build.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: native-build
          path: native-build.tar.zst
          compression-level: 0
          retention-days: 1

  native:
    name: Native gates (${{ matrix.part }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # shares balanced by measured CI time (tests/ci-times.json, tools/ci-times.mjs)
        part: [gl-1of7, gl-2of7, gl-3of7, gl-4of7, gl-5of7, gl-6of7, gl-7of7, webgpu-1of6, webgpu-2of6, webgpu-3of6, webgpu-4of6, webgpu-5of6, webgpu-6of6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libsdl2-dev \
            libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/deps.lock', 'scripts/fetch-deps.sh', 'patches/**') }}
      - name: Fetch dependencies
        run: scripts/fetch-deps.sh
      - uses: actions/download-artifact@v8
        with:
          name: native-build
      # This checkout and the dependencies are newer than the build they made, so their
      # files go back in time (the build's own timestamps must stay: ninja's deps log
      # holds them). The build must then be up to date: rebuilding here would hide a
      # broken hand-over and cost minutes per job.
      - name: Unpack the build
        run: |
          zstd -dc native-build.tar.zst | tar -xf -
          rm native-build.tar.zst
          git ls-files -z | xargs -0 touch -h -d '2000-01-01 00:00:00'
          find deps -exec touch -h -d '2000-01-01 00:00:00' {} +
          ninja -C build/native | tee ninja.log
          if grep -q 'Building\|Linking' ninja.log; then echo "the unpacked build was out of date"; exit 1; fi
      - name: Virtual controllers (uinput, for tests/native-pads.mjs)
        run: |
          sudo modprobe uinput
          printf '%s\n' 'KERNEL=="uinput", MODE="0666"' 'SUBSYSTEM=="input", MODE="0666"' | sudo tee /etc/udev/rules.d/99-cw-test-pads.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
          sudo chmod 0666 /dev/uinput
      - name: Gates (native, software rendering)
        run: node tests/ci.mjs ${{ matrix.part }}

  # Every app as the one cart a game ships: the dual GL + WebGPU cart (the gates
  # run it on GL hosts for GL).
  carts:
    name: Carts (dual ${{ matrix.share }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        share: [1of1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libsdl2-dev libegl-dev libgles-dev
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/deps.lock', 'scripts/fetch-deps.sh', 'patches/**') }}
      - name: Fetch dependencies
        run: scripts/fetch-deps.sh
      - name: Build cwpack (packs the carts' assets)
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build/native cwpack
      - name: Configure
        run: |
          cmake -S . -B build/carts -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/cart.cmake \
            -DCW_WGPU=ON -DCW_CWPACK=$PWD/build/native/tools/cwpack/cwpack
      # share k of n: every n-th cart of carts.txt, starting at the k-th
      - name: Build carts
        run: |
          k=${{ matrix.share }}; n=${k#*of}; k=${k%of*}
          awk -v k="$k" -v n="$n" '(NR - k) % n == 0' build/carts/carts.txt > share.txt
          echo "$(wc -l < share.txt) of $(wc -l < build/carts/carts.txt) carts"
          ninja -C build/carts $(cat share.txt)
          missing=0
          while read -r c; do [ -f "build/carts/carts/$c.wasc" ] || { echo "missing: $c.wasc"; missing=1; }; done < share.txt
          exit $missing
      # every cart it made is a dual GL + WebGPU cart, nothing can opt out, and the build refuses
      # a cart without WebGPU (the control cart must be caught; CW_WGPU=OFF stops at configure)
      - name: Every cart is dual
        run: node tests/no-gl-only-carts.mjs
